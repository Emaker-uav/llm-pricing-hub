name: Update LLM API Pricing

on:
  schedule:
    # Run every 6 hours
    - cron: '23 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run scrapers
        run: |
          cd scrapers
          python run_all.py

      - name: Commit updated pricing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pricing.json
          if git diff --staged --quiet; then
            echo "No pricing changes detected."
          else
            git commit -m "chore: update pricing data"
            git push
            echo "Pricing data updated and pushed."
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npm install -g netlify-cli
          netlify deploy --prod --dir=. --site=cfa8036d-16d6-474c-94f6-572909071bb1
