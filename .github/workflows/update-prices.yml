name: Update LLM API Pricing

on:
  schedule:
    # Run every 6 hours
    - cron: '23 */6 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID || 'cfa8036d-16d6-474c-94f6-572909071bb1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scrapers/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Run scrapers
        run: |
          cd scrapers
          python run_all.py

      - name: Commit updated pricing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pricing.json
          if git diff --staged --quiet; then
            echo "No pricing changes detected."
          else
            git commit -m "chore: update pricing data"
            git push
            echo "Pricing data updated and pushed."
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error title=Missing NETLIFY_AUTH_TOKEN::Create a Netlify personal access token and add it as the repository secret NETLIFY_AUTH_TOKEN."
            exit 1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error title=Missing NETLIFY_SITE_ID::Add the Netlify site id as NETLIFY_SITE_ID, or keep the checked-in fallback site id current."
            exit 1
          fi

          npm install -g netlify-cli@26
          netlify deploy --prod --dir="$GITHUB_WORKSPACE" --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" --message="pricing update ${GITHUB_SHA}"
